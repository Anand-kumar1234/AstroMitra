<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Theme & Colors for Mobile Native Feel -->
    <meta name="theme-color" content="#030508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Celestial Guide" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Celestial Guide - Vedic Destiny Path & Palmistry Scan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Simple Service Worker registration to satisfy strict PWA install criteria on most browsers -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Celestial Guide SW registered:', reg.scope))
            .catch(err => console.error('Celestial Guide SW error:', err));
        });
      }
    </script>
  </body>
</html>
